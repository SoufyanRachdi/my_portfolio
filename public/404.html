<!doctype html>
<html lang="en" class="bg-slate-950 text-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Soufyan Rachdi</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="/headerphoto.png" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: #020617;
        color: #f8fafc;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .card {
        max-width: 480px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(51, 65, 85, 0.8);
        border-radius: 20px;
        padding: 40px 30px;
        backdrop-filter: blur(10px);
      }
      .badge {
        display: inline-block;
        padding: 6px 14px;
        background: rgba(6, 182, 212, 0.1);
        border: 1px solid rgba(6, 182, 212, 0.2);
        color: #22d3ee;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-radius: 9999px;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 36px;
        font-weight: 900;
        margin: 0 0 12px;
        color: #ffffff;
      }
      p {
        color: #94a3b8;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: linear-gradient(135deg, #06b6d4, #2563eb);
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        border-radius: 12px;
        transition: transform 0.2s, opacity 0.2s;
      }
      .btn:hover {
        opacity: 0.9;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">404 Error</div>
      <h1>Page Not Found</h1>
      <p>The page you are looking for does not exist or has been moved. Explore Soufyan Rachdi's developer portfolio and engineering case studies below.</p>
      <a href="/" class="btn">Return to Homepage</a>
    </div>
  </body>
</html>
